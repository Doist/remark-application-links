name: Main CI & Coverage Reporting

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    release-policy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.20.0
            - run: npm run test:release

    build:
        runs-on: ubuntu-latest

        timeout-minutes: 60
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup build tooling
              uses: actions/setup-node@v4
              with:
                  node-version: 24.20.0

            - name: Install dependencies
              run: npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps

            - name: Lint
              run: npm run lint
              env:
                  CI: true

            - name: Test
              run: npm run test:ci

            - name: Build
              run: npm run build
